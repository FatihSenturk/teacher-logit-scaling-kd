model_name: POSTERv2

# dataset configs
dataset_name: RAFDB
num_classes: 7
train_root: data/rafdb_aligned
val_root: data/rafdb_aligned
metadata: data/rafdb_aligned/metadata_rafdb_poster_var.csv

train_frac: 1
val_frac: 1
sample_numbers: 0
train_folds: [2]
val_folds: [3]
train_size: 224
val_size: 224
train_resize_size: 236
transforms_name: QCS-rafdb
train_shuffle: True
batch_size: 48
cache_img: False
update_freq: 1
eval_freq: 1
num_workers: 0
pretrained_timm: False
pretrained_local: ~
use_swanlab: False
use_wandb: False
log_root: results/teacher_logs
swanlab_logdir: swanlog

# optimizer configs
schedule_name: ExponentialLR
use_sam: True
rho: 0.05
optimizer: AdamW
init_lr: 0.000009
weight_decay: 0.0001
gamma: 0.98
max_epochs: 300
t_max: 300
use_amp: False

embedding_file: ~
loss_name: ce_kld_loss
ce_kld_beta: 0.001
metric_name: acc
metric_direction: up
valid_metrics: {"acc/valid": 0}
debug_after: {"train": 1000, "valid": 1000}
seed: 0
vae_head: True
vich_head: False
layer_embedding: True
votes_sum: 0
landmarks: 68

swanlab_project: Unified-FER-Teachers
swanlab_experiment_name: RAFDB-POSTERv2-AffectNetRecipe-LR9e6-Gamma098
swanlab_description: RAF-DB POSTERv2 VAE/CE-KLD teacher using AffectNet-style recipe with LR 9e-6 and gamma 0.98.
swanlab_tags: [RAFDB, teacher, POSTERv2, LayerEmbedding, VAE, CEKLD, AffectNetRecipe, LR9e6, Gamma098]
swanlab_mode: offline
