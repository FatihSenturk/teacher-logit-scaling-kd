model_name: POSTERv2
dataset_name: RAFDB
num_classes: 7

train_root: data/rafdb_aligned
val_root: data/rafdb_aligned
metadata: data/rafdb_aligned/metadata_rafdb_poster_var.csv
train_frac: 1
val_frac: 1
sample_numbers: 0
train_folds: [2]
val_folds: [3]
train_size: 224
val_size: 224
transforms_name: QCS-rafdb
train_shuffle: True
batch_size: 48
cache_img: False
update_freq: 1
eval_freq: 1
num_workers: 4

pretrained_timm: False
pretrained_local: ~

schedule_name: ExponentialLR
gamma: 0.98
use_sam: True
rho: 0.05
optimizer: AdamW
init_lr: 0.000009
weight_decay: 0.0001
max_epochs: 250
t_max: 250
use_amp: False

embedding_file: ~
loss_name: ce_kld_loss
ce_kld_beta: 0.001
metric_name: acc
metric_direction: up
valid_metrics: {"acc/valid": 0}
debug_after: {"train": 1000, "valid": 1000}
seed: 1

vae_head: True
vich_head: False
layer_embedding: True
votes_sum: 0
landmarks: 68

log_root: results/teacher_logs
use_wandb: False
use_swanlab: False
swanlab_project: Unified-FER-Teachers
swanlab_experiment_name: RAFDB-POSTERv2-LE-VAE-CEKLD-BS48-EXP
swanlab_description: RAF-DB POSTERv2 VAE teacher with batch size 48 and exponential LR decay.
swanlab_tags: [RAFDB, teacher, POSTERv2, LayerEmbedding, VAE, CEKLD, BS48, EXP]
swanlab_mode: offline
swanlab_logdir: swanlog
