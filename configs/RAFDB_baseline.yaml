model_name: POSTERv2
# dataset configs
dataset_name: RAFDB
num_classes: 7
train_root: ~ #<DATASET_ROOT>/datasets #set to ~, run valid only
val_root: <DATASET_ROOT>/datasets
metadata: <DATASET_ROOT>/metadata_affectnet&rafdb3_ce.csv
train_frac: 1 
val_frac: 1
sample_numbers: 0
train_folds: [2] #0
val_folds: [5] #1，4 are generated by seedream4.0
train_size: 224
val_size: 224
transforms_name: QCS-rafdb #QCS-ferplus ，POSTERv2-affectnet,QCS-rafdb,CUB200-2011
train_shuffle: True
batch_size: 48
cache_img: ~ #小模型提速明显，大模型好像还变慢一点
update_freq: 1 #多少mini batch，更新一次
eval_freq: 1 #多少epoch，评估一次,弃用
num_workers: 4
pretrained_timm: False
pretrained_local: <CHECKPOINT_ROOT>/best.pt #2025-06-26-21-40,2026-01-02-21-03
#optimizer configs
schedule_name: ExponentialLR #CosineAnnealingLR
use_sam: True
rho: 0.05
optimizer: AdamW
init_lr: 0.000009
weight_decay: 0.0001
gamma: 0.98
max_epochs: 300
t_max: 300
use_amp: False
embedding_file: ~
loss_name: cross_entropy #ce_kld_loss #cross_entropy
metric_name: acc #main metric,以这个指标保存最佳模型，trainloop只计算这个指标
metric_direction: up
#在后面加/valid，以便和trianloop的日志数据区分开
valid_metrics: {'acc/valid':0} #'confusion_matrix/valid':0
debug_after: {'train':1000,'valid':1000} #debug after[train,valid]epochs
seed: 0
vae_head: False #False #True
layer_embedding: False #False #True,valid的时候注意加载的预训练模型和设置是否一致
votes_sum: 0
landmarks: 68