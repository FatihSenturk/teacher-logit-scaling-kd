model_name: POSTERv2
dataset_name: FER2013
num_classes: 8

train_root: data/FERPlus_processed
val_root: data/FERPlus_processed
metadata: configs/FERPlus_majority_metadata.csv
train_frac: 1
val_frac: 1
sample_numbers: 0
train_folds: [0, 1]
val_folds: [2]
train_size: 224
val_size: 224
transforms_name: QCS-ferplus
train_shuffle: True
batch_size: 48
cache_img: False
update_freq: 1
eval_freq: 1
num_workers: 4

pretrained_timm: True
pretrained_local: ~

schedule_name: ExponentialLR
use_sam: True
rho: 0.05
optimizer: AdamW
init_lr: 0.00003
weight_decay: 0.0001
gamma: 0.96
max_epochs: 300
t_max: 300
use_amp: False

embedding_file: ~
loss_name: ce_kld_loss
ce_kld_beta: 0.001
metric_name: acc
metric_direction: up
valid_metrics: {"acc/valid": 0}
debug_after: {"train": 1000, "valid": 1000}
seed: 10

vae_head: False
vich_head: True
vich_use_sampling: True
vich_logvar_min: -10.0
vich_logvar_max: 10.0
vich_init_logvar_bias: 0.0
layer_embedding: True
votes_sum: 10
landmarks: 68

log_root: results/teacher_logs
use_wandb: False
use_swanlab: False
swanlab_logdir: swanlog
