model_name: POSTERv2

# dataset configs
dataset_name: RAFDB
num_classes: 7
train_root: data/rafdb_aligned
val_root: data/rafdb_aligned
metadata: data/rafdb_aligned/metadata_rafdb_poster_var.csv
train_frac: 1
val_frac: 1
sample_numbers: 0
train_folds: [2]
val_folds: [3]
train_size: 224
val_size: 224
train_resize_size: 224
transforms_name: RAFDB_RECIPE
aug_random_erasing_p: 0.5
train_shuffle: True
batch_size: 48
cache_img: True
update_freq: 1
eval_freq: 1
num_workers: 4

# model/pretrain configs
# PHASE C BRIDGE TEACHER (2026-07-20): byte-minimal head-flip of
# RAFDB_posterv2_vich_recipe.yaml (Primary's exact recipe) -- ONLY vae_head and
# vich_head are changed vs. that file. Everything else (RAFDB_RECIPE transform
# with RandomErasing p=0.5, ce_kld_beta=0.001, max_epochs=300, seed=1, SAM,
# batch_size=48) is Primary's recipe verbatim. This isolates head architecture
# as the single difference from Primary, to resolve the head-vs-recipe confound
# behind VAE9182's teacher-ECE advantage. The vich_* keys below are left in
# place but inert (ignored when vich_head=False) so the diff from Primary's
# config is exactly two lines. Pre-registered decision: resulting 15-bin ECE
# on fold-3 val ~0.015 (and NLL-optimal T* ~1.0) -> head attribution; ~0.038
# (T* ~1.3, over-confident like the VICH teachers) -> recipe/augmentation.
pretrained_timm: False
pretrained_local: ~
vae_head: True
vich_head: False
vich_use_sampling: True
vich_logvar_min: -10.0
vich_logvar_max: 10.0
vich_init_logvar_bias: 0.0
layer_embedding: True
votes_sum: 0
landmarks: 68

# optimizer configs
schedule_name: ExponentialLR
gamma: 0.98
use_sam: True
rho: 0.05
optimizer: AdamW
init_lr: 0.000009
weight_decay: 0.0001
max_epochs: 300
t_max: 300
use_amp: False

embedding_file: ~
loss_name: ce_kld_loss
ce_kld_beta: 0.001
metric_name: acc
metric_direction: up
valid_metrics: {"acc/valid": 0}
debug_after: {"train": 1000, "valid": 1000}
seed: 1
use_swanlab: False
use_wandb: False
log_root: results/teacher_logs
